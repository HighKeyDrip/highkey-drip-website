<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Highkey Drip</title>
  <link href="https://fonts.googleapis.com/css2?family=Concert+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <style>
    body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: src('assets/highkey-pattern-zoomed.png');
  background-repeat: repeat;
  background-size: 100px; /* smaller logos */
  opacity: 0.08;
  pointer-events: none;
  z-index: 0;
}
    </style>
</head>
  
<body>
  <header>
    <nav>
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <img src="assets/logo.png" alt="Highkey Drip Logo" class="logo" />
    <h1><span>Unapologetic</span> <span>Style Starts Here</span></h1>
    <a href="#shop" class="shop-button">Shop Now</a>
  </section>

  <section id="shop" class="products">
    <div class="product-grid">
      <img src="assets/shirt1.png" alt="Shirt 1" />
      <img src="assets/shirt2.png" alt="Shirt 2" />
      <img src="assets/shirt3.png" alt="Shirt 3" />
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Highkey Drip. All rights reserved.</p>
  </footer>
</body>
</html>
